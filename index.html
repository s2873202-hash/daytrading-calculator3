<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股當沖損益 - 分批加碼與盈虧比試算</title>
  <style>
    :root {
      --up-color: #e53935;
      --down-color: #43a047;
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
      --rr-target-bg: #fff8e1;
      --rr-stop-bg: #efebe9;
      --primary-color: #1a237e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 980px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary-color);
    }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      font-size: 0.9rem;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    .form-group input, .form-group select {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    /* 多筆進場動態清單樣式 */
    .entries-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .entry-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    .entry-row input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn-add {
      background-color: #2196f3;
      color: white;
    }
    .btn-add:hover { background-color: #1976d2; }
    .btn-del {
      background-color: #ef5350;
      color: white;
      padding: 8px 12px;
    }
    .btn-del:hover { background-color: #d32f2f; }

    /* 平均成本統計面板 */
    .summary-box {
      background-color: #e8eaf6;
      border-left: 5px solid var(--primary-color);
      padding: 12px 16px;
      border-radius: 4px;
      margin-top: 15px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 10px;
    }
    .summary-item {
      text-align: center;
    }
    .summary-item .title {
      font-size: 0.85rem;
      color: #666;
    }
    .summary-item .value {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    /* 表格樣式 */
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e0e0e0;
    }
    th {
      background-color: #f0f4f8;
      color: #333;
      font-weight: 600;
    }
    tr.current-price {
      background-color: #e8eaf6;
      font-weight: bold;
    }
    tr.rr-target-row {
      background-color: var(--rr-target-bg);
    }
    tr.rr-stop-row {
      background-color: var(--rr-stop-bg);
    }
    .text-profit { color: var(--up-color); font-weight: bold; }
    .text-loss { color: var(--down-color); font-weight: bold; }
    .text-center { text-align: center; }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      vertical-align: middle;
    }
    .badge-target {
      background-color: #ffe082;
      color: #b71c1c;
      border: 1px solid #ffd54f;
    }
    .badge-stop {
      background-color: #d7ccc8;
      color: #3e2723;
      border: 1px solid #bcaaa4;
    }
    .badge-breakeven {
      background-color: #e1bee7;
      color: #4a148c;
      border: 1px solid #ce93d8;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>台股當沖損益 - 分批加碼與盈虧比試算</h1>

  <!-- 進場設定卡片 -->
  <div class="card">
    <div class="entries-header">
      <h3 style="margin:0;">分批進場紀錄</h3>
      <button class="btn btn-add" onclick="addEntryRow()">➕ 新增進場價格</button>
    </div>

    <div id="entriesContainer">
      <!-- 預設第一筆進場資料 -->
      <div class="entry-row">
        <input type="number" class="entry-price" value="100" step="0.01" min="0.01" placeholder="進場價格 (元)" oninput="calculate()">
        <input type="number" class="entry-shares" value="1" min="1" placeholder="張數" oninput="calculate()">
        <button class="btn btn-del" onclick="removeEntryRow(this)">✕</button>
      </div>
    </div>

    <!-- 加權平均統計 -->
    <div class="summary-box">
      <div class="summary-item">
        <div class="title">總加碼張數</div>
        <div class="value" id="summaryShares">0 張</div>
      </div>
      <div class="summary-item">
        <div class="title">總累積股數</div>
        <div class="value" id="summaryTotalShares">0 股</div>
      </div>
      <div class="summary-item">
        <div class="title">平均進場成本</div>
        <div class="value" id="summaryAvgPrice">0.00 元</div>
      </div>
    </div>
  </div>

  <!-- 參數與盈虧比設定卡片 -->
  <div class="card">
    <div class="form-grid">
      <div class="form-group">
        <label for="action">交易方向</label>
        <select id="action" onchange="calculate()">
          <option value="long">做多 (先買後賣)</option>
          <option value="short">做空 (先賣後買)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="discount">手續費折扣 (折)</label>
        <input type="number" id="discount" value="2.8" step="0.1" min="0" max="10" oninput="calculate()">
      </div>
      <div class="form-group">
        <label for="stopTicks">停損設定 (退幾檔停損)</label>
        <input type="number" id="stopTicks" value="1" min="1" max="10" oninput="calculate()">
      </div>
      <div class="form-group">
        <label for="rrRatio">期望盈虧比 (風險報酬比)</label>
        <select id="rrRatio" onchange="calculate()">
          <option value="1">1 : 1 (獲利 = 1倍停損金額)</option>
          <option value="2" selected>1 : 2 (獲利 = 2倍停損金額)</option>
          <option value="3">1 : 3 (獲利 = 3倍停損金額)</option>
          <option value="4">1 : 4 (獲利 = 4倍停損金額)</option>
          <option value="5">1 : 5 (獲利 = 5倍停損金額)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 試算結果表格 -->
  <div class="card">
    <h3>以「平均成本」試算上下 10 檔出場損益</h3>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th class="text-center">檔位</th>
            <th class="text-center">出場價格</th>
            <th>漲跌幅</th>
            <th>預估總手續費</th>
            <th>預估交易稅/券資費</th>
            <th>淨損益 (元)</th>
            <th>報酬率 (%)</th>
            <th class="text-center">盈虧比/停損標記</th>
          </tr>
        </thead>
        <tbody id="resultBody">
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // 新增進場列
  function addEntryRow() {
    const container = document.getElementById('entriesContainer');
    const div = document.createElement('div');
    div.className = 'entry-row';
    div.innerHTML = `
      <input type="number" class="entry-price" value="100" step="0.01" min="0.01" placeholder="進場價格 (元)" oninput="calculate()">
      <input type="number" class="entry-shares" value="1" min="1" placeholder="張數" oninput="calculate()">
      <button class="btn btn-del" onclick="removeEntryRow(this)">✕</button>
    `;
    container.appendChild(div);
    calculate();
  }

  // 刪除進場列
  function removeEntryRow(btn) {
    const rows = document.querySelectorAll('.entry-row');
    if (rows.length > 1) {
      btn.parentElement.remove();
      calculate();
    } else {
      alert('至少需要保留一筆進場價格！');
    }
  }

  function getTickSize(price) {
    if (price < 10) return 0.01;
    if (price < 50) return 0.05;
    if (price < 100) return 0.1;
    if (price < 500) return 0.5;
    if (price < 1000) return 1.0;
    return 5.0;
  }

  function getPriceBySteps(basePrice, steps) {
    let price = basePrice;
    const direction = steps > 0 ? 1 : -1;
    const count = Math.abs(steps);

    for (let i = 0; i < count; i++) {
      let tick = getTickSize(price);
      if (direction === -1) {
        if ([10, 50, 100, 500, 1000].includes(Number(price.toFixed(2)))) {
          tick = getTickSize(price - 0.01);
        }
      }
      price += direction * tick;
      price = Math.round(price * 100) / 100;
    }
    return price;
  }

  function calculateNetProfit(action, avgEntryPrice, exitPrice, totalShares, discountRatio) {
    const baseFeeRate = 0.001425;
    const taxRate = 0.0015;
    const borrowFeeRate = 0.0008;

    let buyPrice, sellPrice;
    if (action === 'long') {
      buyPrice = avgEntryPrice;
      sellPrice = exitPrice;
    } else {
      buyPrice = exitPrice;
      sellPrice = avgEntryPrice;
    }

    const buyAmount = buyPrice * totalShares;
    const sellAmount = sellPrice * totalShares;

    let buyFee = Math.floor(buyAmount * baseFeeRate * discountRatio);
    if (buyFee < 20) buyFee = 20;

    let sellFee = Math.floor(sellAmount * baseFeeRate * discountRatio);
    if (sellFee < 20) sellFee = 20;

    const totalFee = buyFee + sellFee;

    let taxAndBorrowFee = 0;
    if (action === 'long') {
      taxAndBorrowFee = Math.floor(sellAmount * taxRate);
    } else {
      taxAndBorrowFee = Math.floor(sellAmount * taxRate) + Math.floor(sellAmount * borrowFeeRate);
    }

    const rawProfit = sellAmount - buyAmount;
    const netProfit = rawProfit - totalFee - taxAndBorrowFee;
    const returnRate = ((netProfit / buyAmount) * 100).toFixed(2);

    return { buyAmount, totalFee, taxAndBorrowFee, netProfit, returnRate };
  }

  function calculate() {
    const action = document.getElementById('action').value;
    const discountRatio = (parseFloat(document.getElementById('discount').value) || 10) / 10;
    const stopTicks = parseInt(document.getElementById('stopTicks').value) || 1;
    const rrRatioTarget = parseInt(document.getElementById('rrRatio').value) || 2;

    // 1. 計算多筆進場的總張數與加權平均價格
    const priceInputs = document.querySelectorAll('.entry-price');
    const sharesInputs = document.querySelectorAll('.entry-shares');

    let totalSharesNum = 0;
    let totalCostAmount = 0;

    for (let i = 0; i < priceInputs.length; i++) {
      const p = parseFloat(priceInputs[i].value) || 0;
      const s = parseInt(sharesInputs[i].value) || 0;
      if (p > 0 && s > 0) {
        totalSharesNum += s;
        totalCostAmount += p * (s * 1000);
      }
    }

    const totalShares = totalSharesNum * 1000;
    const avgEntryPrice = totalShares > 0 ? (totalCostAmount / totalShares) : 0;

    // 更新頂部平均成本面板
    document.getElementById('summaryShares').innerText = `${totalSharesNum} 張`;
    document.getElementById('summaryTotalShares').innerText = `${totalShares.toLocaleString()} 股`;
    document.getElementById('summaryAvgPrice').innerText = `${avgEntryPrice.toFixed(2)} 元`;

    const tbody = document.getElementById('resultBody');
    tbody.innerHTML = '';

    if (avgEntryPrice <= 0 || totalShares <= 0) return;

    // 2. 計算停損價位的淨虧損金額 (風險金額)
    const stopStep = action === 'long' ? -stopTicks : stopTicks;
    const stopExitPrice = getPriceBySteps(avgEntryPrice, stopStep);
    const stopRes = calculateNetProfit(action, avgEntryPrice, stopExitPrice, totalShares, discountRatio);
    const expectedRiskAmount = Math.abs(stopRes.netProfit);

    // 3. 試算上下 10 檔數據
    const rows = [];
    for (let i = 10; i >= -10; i--) {
      const exitPrice = getPriceBySteps(avgEntryPrice, i);
      const res = calculateNetProfit(action, avgEntryPrice, exitPrice, totalShares, discountRatio);
      rows.push({ step: i, exitPrice, ...res });
    }

    // 4. 尋找滿足 淨獲利 >= 風險金額 * rrRatioTarget 的第一個檔位
    let targetStep = null;
    if (action === 'long') {
      for (let i = 1; i <= 10; i++) {
        const item = rows.find(r => r.step === i);
        if (item && item.netProfit >= expectedRiskAmount * rrRatioTarget) {
          targetStep = i;
          break;
        }
      }
    } else {
      for (let i = -1; i >= -10; i--) {
        const item = rows.find(r => r.step === i);
        if (item && item.netProfit >= expectedRiskAmount * rrRatioTarget) {
          targetStep = i;
          break;
        }
      }
    }

    // 5. 渲染表格
    rows.forEach(item => {
      const exitPrice = item.exitPrice;
      const netProfit = item.netProfit;
      const returnRate = item.returnRate;
      const priceDiffPercent = (((exitPrice - avgEntryPrice) / avgEntryPrice) * 100).toFixed(2);

      const tr = document.createElement('tr');
      let noteTag = '';

      if (item.step === 0) {
        tr.classList.add('current-price');
        noteTag = `<span class="badge badge-breakeven">平均成本價</span>`;
      } else if (item.step === stopStep) {
        tr.classList.add('rr-stop-row');
        noteTag = `<span class="badge badge-stop">預設停損 (退 ${stopTicks} 檔)</span>`;
      } else if (item.step === targetStep) {
        tr.classList.add('rr-target-row');
        noteTag = `<span class="badge badge-target">🎯 盈虧比 1:${rrRatioTarget} 達標檔位</span>`;
      }

      const profitClass = netProfit > 0 ? 'text-profit' : (netProfit < 0 ? 'text-loss' : '');
      const stepText = item.step > 0 ? `+${item.step} 檔` : (item.step < 0 ? `${item.step} 檔` : '均價');

      tr.innerHTML = `
        <td class="text-center">${stepText}</td>
        <td class="text-center">${exitPrice.toFixed(2)}</td>
        <td class="${priceDiffPercent > 0 ? 'text-profit' : (priceDiffPercent < 0 ? 'text-loss' : '')}">
          ${priceDiffPercent > 0 ? '+' : ''}${priceDiffPercent}%
        </td>
        <td>$${item.totalFee.toLocaleString()}</td>
        <td>$${item.taxAndBorrowFee.toLocaleString()}</td>
        <td class="${profitClass}">$${item.netProfit.toLocaleString()}</td>
        <td class="${profitClass}">${returnRate}%</td>
        <td class="text-center">${noteTag}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 初始化計算
  calculate();
</script>

</body>
</html>
